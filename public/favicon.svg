<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1a" />
      <stop offset="100%" stop-color="#141413" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect width="128" height="128" rx="30" fill="url(#anGrad)" />
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="#f8f6f0" stroke-opacity="0.15" stroke-width="2" />

  <!-- Monogram AN. with Editorial Serif Styling -->
  <text
    x="62"
    y="83"
    font-family="Georgia, Cambria, 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    fill="#f8f6f0"
    text-anchor="middle"
    letter-spacing="-1.5"
  >AN<tspan fill="#c84b26" font-size="60">.</tspan></text>
</svg>
